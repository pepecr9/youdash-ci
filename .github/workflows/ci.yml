name: YouDash CI (module + tests)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: macos-latest
    env:
      SIMCTL_CHILD_OS_ACTIVITY_DT_MODE: "YES"  # mirror NSLog to stderr so simctl --console sees PASSED markers
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEW=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEW" && echo "Selected $NEW"
          xcrun simctl list runtimes
      - name: Toolchain
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version && python3 --version
      - name: Compile module (official script, no app input or signing)
        run: |
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"  # issue #6: avoids MacOSX sysroot warning
          python3 scripts/build_carplay.py --compile-only
          shasum -a 256 build/YouTubeCarPlay.dylib
          xcrun otool -l build/YouTubeCarPlay.dylib | grep -A4 LC_BUILD_VERSION
      - name: Privacy/signing audit
        run: python3 scripts/audit_release.py . --artifact build/YouTubeCarPlay.dylib
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in sorted(d.items(),reverse=True) if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
      - name: Native surface harness
        continue-on-error: true
        id: surface
        run: python3 tests/run_native_surface.py "$UDID"
      - name: Watch layout harness
        continue-on-error: true
        id: watch
        run: python3 tests/run_watch_layout.py "$UDID"
      - name: Simulator log on harness failure
        if: steps.surface.outcome == 'failure' || steps.watch.outcome == 'failure'
        run: xcrun simctl spawn "$UDID" log show --last 10m --style compact --predicate 'process == "SurfaceTests"' | tail -80
      - name: Harness verdict
        run: test "${{ steps.surface.outcome }}" = success && test "${{ steps.watch.outcome }}" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YouTubeCarPlay-module-unsigned
          path: build/YouTubeCarPlay.dylib
